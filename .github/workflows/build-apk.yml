name: Build Wear OS APK (armeabi-v7a)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: '選擇建置類型: release (推薦) / debug / all'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - release
          - debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (armeabi-v7a)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 檢出程式碼 (Checkout Code)
        uses: actions/checkout@v4

      - name: 設定 JDK 21 (Setup Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 設定 Gradle (Setup Gradle)
        uses: gradle/actions/setup-gradle@v4

      - name: 準備環境配置與金鑰 (Prepare Config, Env & Keystores)
        run: |
          echo "=== 準備 .env 與 google-services.json 配置文件 ==="
          
          # 1. 確保 .env 存在
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
            echo "已從 .env.example 建立 .env"
          elif [ ! -f ".env" ]; then
            touch .env
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" >> .env
            echo "已建立預設 .env"
          fi

          # 2. 確保 app/google-services.json 存在
          if [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "pixel-browser-mock",
              "storage_bucket": "pixel-browser-mock.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.aistudio.wearbrowser.zvpxkl"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "fake_api_key_for_ci_build"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            echo "已自動產生佔位 app/google-services.json"
          fi

          echo "=== 設定 Debug 與 Release 簽署金鑰 ==="
          # 3. 復原 Debug Keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "已從 debug.keystore.base64 還原 debug.keystore"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "已自動生成 debug.keystore"
          fi

          # 4. 準備 Release Keystore
          if [ ! -f "my-upload-key.jks" ] && [ -z "$KEYSTORE_PATH" ]; then
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Pixel Browser,O=WearOS,C=US"
            echo "已自動生成 my-upload-key.jks"
          fi

      - name: 賦予 Gradlew 執行權限 (Set Executable Permissions)
        run: chmod +x gradlew

      - name: 建置 Release APK (優化壓縮與混淆，體積最小推薦)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release' }}
        env:
          STORE_PASSWORD: "android"
          KEY_PASSWORD: "android"
        run: |
          ./gradlew assembleRelease -Djava.awt.headless=true --no-daemon --stacktrace

      - name: 建置 Debug APK (除錯專用)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'debug' }}
        env:
          STORE_PASSWORD: "android"
          KEY_PASSWORD: "android"
        run: |
          ./gradlew assembleDebug -Djava.awt.headless=true --no-daemon --stacktrace

      - name: 整理輸出 APK 檔案 (Collect Artifacts)
        run: |
          mkdir -p output-apks
          # 複製 Release APK (前綴清楚，避免手機端被截斷)
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            cp app/build/outputs/apk/release/*.apk output-apks/Release-PixelBrowser-v7a.apk
            echo "已收集 Release-PixelBrowser-v7a.apk (推薦安裝)"
          fi
          # 複製 Debug APK
          if compgen -G "app/build/outputs/apk/debug/*.apk" > /dev/null; then
            cp app/build/outputs/apk/debug/*.apk output-apks/Debug-PixelBrowser-v7a.apk
            echo "已收集 Debug-PixelBrowser-v7a.apk"
          fi
          echo "=== 構建產出檔案清單與大小 ==="
          ls -lh output-apks/

      - name: 上傳 Release APK (推薦安裝版本)
        if: hashFiles('output-apks/Release-PixelBrowser-v7a.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Release-PixelBrowser-v7a
          path: output-apks/Release-PixelBrowser-v7a.apk
          retention-days: 30

      - name: 上傳全部 APK (Debug + Release 打包)
        uses: actions/upload-artifact@v4
        with:
          name: PixelBrowser-WearOS-v7a-All
          path: output-apks/*.apk
          retention-days: 30

      - name: 發布 GitHub Release (Publish Release on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
